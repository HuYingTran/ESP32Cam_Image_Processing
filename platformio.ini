; ESP32-CAM Image Processing
;
; Chọn bài cần chạy:
;   - Sửa default_envs bên dưới, hoặc
;   - Chọn env trên thanh trạng thái VS Code (biểu tượng "env:..."), hoặc
;   - Dòng lệnh: pio run -e 01_face_detection -t upload
;
; Cấu hình WiFi/camera: common/config.h + common/secrets.h
; Cấu hình mô hình của từng bài: projects/NN_xxx/src/lesson_config.h

[platformio]
src_dir = projects
; Code dùng chung (common/esp32cam: camera_init, wifi_init) là thư viện, chỉ được build khi bài nào #include
lib_dir = common
default_envs = 01_face_detection

; ----- Cấu hình chung cho mọi bài Arduino -----
[env]
; Ghim platform để giữ Arduino core 2.0.17 (core 3.x đã bỏ face detection)
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
monitor_speed = 115200
; Đế nạp ESP32-CAM-MB nối DTR/RTS vào EN/IO0: để mặc định thì monitor giữ board ở trạng thái reset
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
; esp32cam.json đã có sẵn -DBOARD_HAS_PSRAM và partition huge_app.csv
build_flags =
    -I common
    -DCORE_DEBUG_LEVEL=3

; ----- Các bài -----
[env:01_face_detection]
build_src_filter = +<01_face_detection/src/>

[env:02_face_recognition]
; Core 2.0.x tắt face recognition trên ESP32 thường → dùng platform 3.5.0 (Arduino core 1.0.6)
platform = espressif32@3.5.0
build_src_filter = +<02_face_recognition/src/>
; Có phân vùng "fr" để lưu khuôn mặt đã enroll
board_build.partitions = projects/02_face_recognition/partitions.csv

[env:03_motion_detection]
build_src_filter = +<03_motion_detection/src/>

[env:04_color_tracking]
build_src_filter = +<04_color_tracking/src/>

[env:05_qr_reader]
build_src_filter = +<05_qr_reader/src/>
; Dùng quirc đi kèm thư viện (src/quirc), không dùng lớp ESP32QRCodeReader
lib_deps = alvarowolfx/ESP32QRCodeReader@1.1.0

[env:07_capture]
; Firmware phụ của bài #7: web xem trước + /capture.jpg để thu ảnh train trên Edge Impulse
build_src_filter = +<07_image_classification/capture/>
